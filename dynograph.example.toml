# dynograph service configuration — example.
#
# All sections are optional; omitted ones use defaults. Env vars
# override TOML values at startup:
#   DYNOGRAPH_BIND          — overrides [server].bind
#   DYNOGRAPH_STORAGE_ROOT  — overrides [storage].root
#
# Typical patterns:
#   - In-memory dev (no [storage]): ephemeral, ready immediately,
#     graphs lost on restart.
#   - On-disk prod ([storage].root set): RocksDB-backed, rehydrates
#     graphs at startup, /ready returns 503 until rehydrate finishes.

[server]
# Listen address. Default 127.0.0.1:8080 (localhost only). The
# Docker image overrides to 0.0.0.0:8080 via env var so the host's
# port mapping is the access boundary.
bind = "0.0.0.0:8080"

# Ingress hardening (all optional; defaults shown). Tune for your
# deployment's request sizes and load profile.
#   max_body_bytes          — reject larger request bodies with 413.
#                             Default 16 MiB (admits the largest util
#                             vector / batch payloads with headroom).
# max_body_bytes = 16777216
#   request_timeout_secs    — return 408 when a request runs longer.
# request_timeout_secs = 30
#   max_concurrent_requests — cap simultaneously-executing /v1 requests;
#                             excess is shed with 503. Health/ready/
#                             metrics probes are exempt.
# max_concurrent_requests = 1024

[storage]
# RocksDB root. When set, every graph lives at {root}/{id}/db/
# (RocksDB store) + {root}/{id}/schema.json (canonical schema for
# rehydration). When absent, the service runs in-memory.
root = "/data"

# [auth] is omitted entirely → defaults to `provider = "noauth"`.
# Every request authenticates as "anonymous"; downstream consumers
# layer their own authorization on top.
#
# To switch to bearer JWT, uncomment exactly one of the blocks
# below. Set exactly one of `secret` (literal — fine for dev) or
# `secret_env = "VAR_NAME"` (recommended — keeps the signing secret
# out of TOML committed to repos). Optional `issuer` and `audience`
# enforce the corresponding token claims.
#
# [auth]
# provider = "bearer_jwt"
# secret_env = "DYNOGRAPH_JWT_SECRET"
# issuer = "https://auth.example.com"
# audience = "dynograph"
