name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-progress runs for the same PR (a new push obsoletes
# the prior run). Pushes to main are never cancelled — each main commit
# gets a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so a clippy-lint expansion can't break CI without a code
  # change. Bump deliberately; keep `rust-version` (MSRV) in Cargo.toml.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fulltext:
    # The full-text/BM25 path (the `dynograph-text` crate plus the
    # `fulltext`-gated wiring in dynograph-storage and dynograph-service) sits
    # behind an opt-in cargo feature that is OFF by default — so build-test and
    # test-release never compile or exercise it, leaving every
    # `#[cfg(feature = "fulltext")]` engine/service integration test unrun. The
    # shipped Docker image builds WITH the feature, so this leg builds, tests,
    # and lints the same configuration to keep it green. Enabling the service
    # feature transitively enables dynograph-storage/fulltext.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo build --workspace --all-targets --features dynograph-service/fulltext
      - run: cargo test --workspace --features dynograph-service/fulltext
      - run: cargo clippy --workspace --all-targets --features dynograph-service/fulltext -- -D warnings

  test-release:
    # Tests under the release profile. Catches the class that only
    # manifests with optimizations on and debug assertions off:
    # saturating `as` casts (e.g. the V1 `random_level` overflow that
    # panicked only in debug) and any `debug_assert!`-guarded check that
    # silently vanishes in release. fmt/clippy/MSRV are profile-agnostic
    # and stay in build-test; this leg adds only the missing coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --release

  smoke-test:
    # release.yml publishes a Docker image that was never actually run.
    # Build the binary, boot it (in-memory, no-auth defaults), and probe
    # the operational endpoints so a binary that fails to start — or a
    # route that 500s on a fresh process — fails CI instead of shipping.
    # Build with the same `fulltext` feature the Dockerfile enables so this
    # boots the exact binary configuration the published image ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Build with the same features as the published image (the Dockerfile uses
      # `--features graph,dynograph-service/fulltext`) so the binary we
      # smoke-test matches what ships.
      - run: cargo build --release --bin dynograph --features graph,dynograph-service/fulltext
      - run: ./scripts/smoke-test.sh

  storage-rocksdb:
    # Backend matrix: the storage engine suite also runs against a real
    # temp-dir RocksDB store, not just the in-memory map (build-test
    # already covers in-memory). The C1 `commit_batch` panic reached main
    # because every batch test was in-memory and the array-indexed
    # column-family handles only diverge on RocksDB — this leg is the
    # guard against that whole class. `test_engine` in the storage tests
    # honors DYNOGRAPH_TEST_BACKEND.
    runs-on: ubuntu-latest
    env:
      DYNOGRAPH_TEST_BACKEND: rocksdb
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test -p dynograph-storage

  no-default-features:
    # The mirror image of storage-rocksdb: proves the in-memory-ONLY build
    # (`--no-default-features`, so the `rocksdb` feature is off) compiles,
    # tests, and lints clean — and, crucially, does NOT compile librocksdb-sys.
    # This is the fast path a consumer or local dev uses to skip the
    # ~10-minute C++ build when persistence isn't needed (the whole point of
    # gating RocksDB). clippy -D warnings here also catches code that only the
    # RocksDB backend uses but wasn't gated (e.g. a dead_code helper).
    #
    # Scoped to `-p dynograph-storage -p dynograph-service` (the only crates
    # that touch RocksDB) rather than `--workspace`: on a *virtual* manifest,
    # `cargo --workspace --no-default-features` still builds each member with
    # its own default features, so storage's `rocksdb` default would sneak back
    # in. Explicit `-p` selection honours `--no-default-features` correctly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo build -p dynograph-storage -p dynograph-service --all-targets --no-default-features
      - run: cargo test -p dynograph-storage -p dynograph-service --no-default-features
      - run: cargo clippy -p dynograph-storage -p dynograph-service --all-targets --no-default-features -- -D warnings
      # fulltext WITHOUT rocksdb — the cell no job covered until 2026-07-28,
      # and the one that was broken: a test called a `#[cfg(feature =
      # "rocksdb")]` helper without carrying the gate, so this configuration
      # could not compile its own tests while "a build without RocksDB must
      # work" is a stated requirement. Neither neighbouring job would have
      # caught it — the default-features jobs have rocksdb on, and the plain
      # --no-default-features run above has fulltext off. --all-targets is
      # load-bearing: the break was in test code, not the library.
      - run: cargo build -p dynograph-storage -p dynograph-service --all-targets --no-default-features --features dynograph-storage/fulltext
      - run: cargo test -p dynograph-storage -p dynograph-service --no-default-features --features dynograph-storage/fulltext
      - run: cargo clippy -p dynograph-storage -p dynograph-service --all-targets --no-default-features --features dynograph-storage/fulltext -- -D warnings

  graph-feature:
    # The graph-theory algorithm endpoints (`/v1/graphs/{id}/algo/*`) live
    # behind the optional `graph` feature, so the default `cargo test
    # --workspace` never exercises the service-side algo path or its
    # feature-gated integration tests. Run the service suite and clippy with
    # the feature on so the algo wiring can't rot undetected. (The
    # `dynograph-graph` crate's own unit tests already run in build-test as a
    # workspace member.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo test -p dynograph-service --features graph
      - run: cargo clippy -p dynograph-service --features graph --all-targets -- -D warnings

  msrv-check:
    # Builds against the declared MSRV (Cargo.toml's `rust-version`).
    # Catches "we accidentally used a feature stabilized after MSRV"
    # and "a transitive dep silently raised its MSRV". Build only —
    # tests and clippy may pull in dev-deps with higher MSRVs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.94.0"
      - run: cargo build --workspace

  doc-version-drift:
    # Asserts hardcoded version strings in README + docs match
    # Cargo.toml's workspace version. Catches the v0.3.x drift class
    # mechanically — bump Cargo.toml without bumping the docs and CI
    # rejects the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-doc-versions.sh

  cargo-deny:
    # Supply-chain hygiene: security advisories (RUSTSEC), license
    # compliance, duplicate-version detection. See deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    # Catches typos in source, docs, comments. Uses crate-ci/typos
    # defaults; if a project-specific term gets flagged, allowlist it
    # via _typos.toml at repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1.46.0

  semver-checks:
    # PRs and direct pushes to main. Gating on PRs alone lets a
    # bypass-PR push silently break the public surface.
    #
    # The logic lives in scripts/check-semver.sh so it can be run locally
    # exactly as CI runs it — same convention as check-doc-versions.sh. Read
    # that script's header before changing anything here: it documents why
    # `--workspace` checks NOTHING in this repo (publish = false makes
    # cargo-semver-checks skip every crate) and why the baseline is derived
    # rather than hand-maintained.
    #
    # Consumers rely on this gate: reflow2 pins a tag and forwards to the
    # `rocksdb` and `fulltext` feature names, and a feature rename is a
    # downstream build break that only this check would catch.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history so cargo-semver-checks can check out the
          # baseline rev's tree, and so `git describe` can see the tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: cargo semver-checks
        run: ./scripts/check-semver.sh
