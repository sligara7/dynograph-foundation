name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-progress runs for the same PR (a new push obsoletes
# the prior run). Pushes to main are never cancelled — each main commit
# gets a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so a clippy-lint expansion can't break CI without a code
  # change. Bump deliberately; keep `rust-version` (MSRV) in Cargo.toml.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-release:
    # Tests under the release profile. Catches the class that only
    # manifests with optimizations on and debug assertions off:
    # saturating `as` casts (e.g. the V1 `random_level` overflow that
    # panicked only in debug) and any `debug_assert!`-guarded check that
    # silently vanishes in release. fmt/clippy/MSRV are profile-agnostic
    # and stay in build-test; this leg adds only the missing coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --release

  smoke-test:
    # release.yml publishes a Docker image that was never actually run.
    # Build the binary, boot it (in-memory, no-auth defaults), and probe
    # the operational endpoints so a binary that fails to start — or a
    # route that 500s on a fresh process — fails CI instead of shipping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Build with the same features as the published image (Dockerfile uses
      # `--features graph`) so the binary we smoke-test matches what ships.
      - run: cargo build --release --bin dynograph --features graph
      - run: ./scripts/smoke-test.sh

  storage-rocksdb:
    # Backend matrix: the storage engine suite also runs against a real
    # temp-dir RocksDB store, not just the in-memory map (build-test
    # already covers in-memory). The C1 `commit_batch` panic reached main
    # because every batch test was in-memory and the array-indexed
    # column-family handles only diverge on RocksDB — this leg is the
    # guard against that whole class. `test_engine` in the storage tests
    # honors DYNOGRAPH_TEST_BACKEND.
    runs-on: ubuntu-latest
    env:
      DYNOGRAPH_TEST_BACKEND: rocksdb
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test -p dynograph-storage

  graph-feature:
    # The graph-theory algorithm endpoints (`/v1/graphs/{id}/algo/*`) live
    # behind the optional `graph` feature, so the default `cargo test
    # --workspace` never exercises the service-side algo path or its
    # feature-gated integration tests. Run the service suite and clippy with
    # the feature on so the algo wiring can't rot undetected. (The
    # `dynograph-graph` crate's own unit tests already run in build-test as a
    # workspace member.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo test -p dynograph-service --features graph
      - run: cargo clippy -p dynograph-service --features graph --all-targets -- -D warnings

  msrv-check:
    # Builds against the declared MSRV (Cargo.toml's `rust-version`).
    # Catches "we accidentally used a feature stabilized after MSRV"
    # and "a transitive dep silently raised its MSRV". Build only —
    # tests and clippy may pull in dev-deps with higher MSRVs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.94.0"
      - run: cargo build --workspace

  doc-version-drift:
    # Asserts hardcoded version strings in README + docs match
    # Cargo.toml's workspace version. Catches the v0.3.x drift class
    # mechanically — bump Cargo.toml without bumping the docs and CI
    # rejects the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-doc-versions.sh

  cargo-deny:
    # Supply-chain hygiene: security advisories (RUSTSEC), license
    # compliance, duplicate-version detection. See deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    # Catches typos in source, docs, comments. Uses crate-ci/typos
    # defaults; if a project-specific term gets flagged, allowlist it
    # via _typos.toml at repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1.46.0

  semver-checks:
    # PRs and direct pushes to main. Gating on PRs alone lets a
    # bypass-PR push silently break the public surface.
    #
    # Foundation crates are not published to crates.io, so the default
    # crates.io baseline doesn't work. We compare against the most
    # recent compilable git tag instead. Bump SEMVER_BASELINE_REV after
    # each release that produces a green build.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      SEMVER_BASELINE_REV: v0.4.0
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history so cargo-semver-checks can check out the
          # baseline rev's tree.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: cargo semver-checks
        run: cargo semver-checks --workspace --baseline-rev "$SEMVER_BASELINE_REV"
