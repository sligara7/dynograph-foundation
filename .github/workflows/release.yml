name: Release

on:
  push:
    tags: ['v*']

# Repo-level setting required: Settings → Actions → General →
# "Workflow permissions" → "Read and write permissions" must be on,
# OR the repo's package-write permission must be granted explicitly.
# Without this, the docker/login step succeeds but the push fails
# with `denied: permission_denied`.

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Capture provenance for the Dockerfile's GIT_SHA / GIT_DIRTY
      # build args. `.git/` is excluded from the Docker build context,
      # so this is the only path for the image to report a meaningful
      # `git_sha` on `/buildinfo` and `dynograph_build_info`. On a
      # tag-push event the working tree is always clean.
      - name: Compute git provenance
        id: provenance
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "dirty=false" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sligara7/dynograph-foundation
          # `type=ref,event=tag` produces `0.5.0` from a `v0.5.0` push tag
          # (the `v` prefix is stripped by default). `type=raw,value=latest`
          # always also tags `:latest` so consumers can pull the most
          # recent release without knowing the version.
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.provenance.outputs.sha }}
            GIT_DIRTY=${{ steps.provenance.outputs.dirty }}
          # GitHub Actions cache: cuts subsequent rebuilds from
          # ~10min (cold RocksDB compile) to ~1-2min when only the
          # source has changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
