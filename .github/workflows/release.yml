name: Release

on:
  push:
    tags: ['v*']

# Repo-level setting required: Settings → Actions → General →
# "Workflow permissions" → "Read and write permissions" must be on,
# OR the repo's package-write permission must be granted explicitly.
# Without this, the docker/login step succeeds but the push fails
# with `denied: permission_denied`.

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Capture provenance for the Dockerfile's GIT_SHA / GIT_DIRTY
      # build args. `.git/` is excluded from the Docker build context,
      # so this is the only path for the image to report a meaningful
      # `git_sha` on `/buildinfo` and `dynograph_build_info`. On a
      # tag-push event the working tree is always clean.
      - name: Compute git provenance
        id: provenance
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "dirty=false" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sligara7/dynograph-foundation
          # Industry convention for container image tags is unprefixed
          # semver — `nginx:1.25.3`, `redis:7.2.4`, `rust:1.74.0` —
          # never `:v1.25.3`. Git tags carry the `v` prefix per
          # SemVer.org's recommendation; container tags don't.
          #
          # `type=semver,pattern={{version}}` does the v-strip
          # automatically: a `v0.5.6` git tag push produces `:0.5.6`.
          # `type=raw,value=latest` always also tags `:latest` so
          # consumers can pull the most recent release without knowing
          # the version.
          #
          # (Pre-fix this workflow used `type=ref,event=tag`, whose
          # comment claimed v-stripping behavior it doesn't have —
          # silently published `:v0.5.6` for the v0.5.0–v0.5.5 era.
          # Fixed 2026-05-11; future releases publish at `:X.Y.Z`. Old
          # `:vX.Y.Z` tags on the registry are stranded but harmless.)
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.provenance.outputs.sha }}
            GIT_DIRTY=${{ steps.provenance.outputs.dirty }}
          # GitHub Actions cache: cuts subsequent rebuilds from
          # ~10min (cold RocksDB compile) to ~1-2min when only the
          # source has changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A GHCR image without a Releases entry is how v0.9.2/v0.9.3 went
  # missing from the Releases page (found 2026-06-12, backfilled by
  # hand). Automation over memory: every tag push now also creates the
  # GitHub Release, with notes lifted from the tag's CHANGELOG section.
  # Runs in parallel with the image build — a Release whose image is
  # still building for a few minutes beats no Release at all, and a
  # rare image-build failure is visible right next to it in Actions.
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract this tag's CHANGELOG section
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          # From "## <tag> " up to (not including) the next "## v" heading.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag " " { hit = 1; next }
            hit && /^## v/      { exit }
            hit                 { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::no CHANGELOG section found for $TAG — releasing with auto-generated notes"
            echo "_No CHANGELOG section for $TAG; see commit history._" > /tmp/notes.md
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
