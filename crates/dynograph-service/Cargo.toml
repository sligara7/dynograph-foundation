[package]
name = "dynograph-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dynograph-core = { path = "../dynograph-core" }
# `default-features = false` so the storage `rocksdb` default isn't force-enabled
# through this edge (which would defeat `--no-default-features`). The service's
# own `rocksdb` / `fulltext` features forward to storage instead.
dynograph-storage = { path = "../dynograph-storage", default-features = false }
dynograph-vector = { path = "../dynograph-vector" }
dynograph-graph = { path = "../dynograph-graph", optional = true }
dynograph-game = { path = "../dynograph-game" }
dynograph-cluster = { path = "../dynograph-cluster" }
dynograph-resolution = { path = "../dynograph-resolution" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
thiserror = { workspace = true }
toml = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true }

[features]
default = ["rocksdb"]
# On-disk RocksDB storage (the `storage.root` / `DYNOGRAPH_STORAGE_ROOT` mode).
# Forwards to `dynograph-storage/rocksdb`. On by default; build with
# `--no-default-features` to ship an in-memory-only binary that skips the
# RocksDB C++ compile. Such a binary fails loud at startup if `storage.root`
# is set (it cannot honour on-disk mode).
rocksdb = ["dynograph-storage/rocksdb"]
# Enable the full-text search endpoints (`search:text` / `search:reindex`).
# Turns on `dynograph-storage/fulltext` (which compiles Tantivy); without it
# the routes still exist but return 501 Not Implemented.
fulltext = ["dynograph-storage/fulltext"]
# Enable the graph-theory algorithm endpoints (`algo/*`). Pulls in the
# `dynograph-graph` crate; without it the routes still exist but return 501
# Not Implemented (keeping the OpenAPI contract feature-independent).
graph = ["dep:dynograph-graph"]

[[bin]]
name = "dynograph"
path = "src/bin/dynograph.rs"

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
# UDS integration test drives the Unix-socket listener with a raw hyper
# client over a `tokio::net::UnixStream` — hyper's low-level http1
# connection API plus hyper-util's TokioIo to bridge tokio's AsyncRead/
# Write onto hyper's IO traits.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"
jsonwebtoken = { workspace = true }
# Used by persistence tests to plant raw on-disk state (e.g. a degenerate
# embedding the HTTP boundary would reject) and verify rehydrate fails loud.
# `default-features = false` for the same reason as the normal edge above —
# the persistence tests that need RocksDB are gated on the service `rocksdb`
# feature, which forwards `dynograph-storage/rocksdb` when enabled.
dynograph-storage = { path = "../dynograph-storage", default-features = false }
dynograph-core = { path = "../dynograph-core" }
